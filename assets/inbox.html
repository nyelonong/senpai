<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>senpai inbox</title>
<style>
:root{
  color-scheme:light dark;
  --font:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --bg:#f6f8fc; --surface:#ffffff; --fg:#16233b; --muted:#5b6b85; --faint:#7a879c; --line:#c9d3e3;
  --accent:#1352bf; --accent-soft:#e4edfc; --on-accent:#ffffff;
  --del-fg:#b3382f; --del-bg:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1626; --surface:#162136; --fg:#e6ecf7; --muted:#9aa9c2; --faint:#7786a0; --line:#33425e;
    --accent:#7fa8f5; --accent-soft:#1b2c4d; --on-accent:#0e1626;
    --del-fg:#f2a19a; --del-bg:#3a1a1c;
  }
}
*{box-sizing:border-box}
@font-face{font-family:"Nunito";src:url("font/nunito-latin-var.woff2") format("woff2");font-weight:200 1000;font-style:normal;font-display:swap}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font)}
main{max-width:1200px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-size:22px;font-weight:800;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:14px}
.empty{color:var(--faint);padding:48px 16px;text-align:center;border:1px dashed var(--line);border-radius:10px;margin:0}
#items{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:12px}
#items:empty{display:none}
.item{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item.question{border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-weight:700}
.kind{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-weight:800;white-space:nowrap}
.title{font-size:16px;font-weight:800;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:balance}
.places{font:12px/1.5 var(--mono);color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap;margin:0}
.foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
a.open,button{display:inline-block;font:800 13px/1.4 var(--font);padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap}
a.open:hover,button:hover:not(:disabled){border-color:var(--accent)}
a.open,button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.choices{display:flex;gap:6px;flex-wrap:wrap}
button.choice{border-radius:999px;font-weight:700;padding:5px 12px;background:var(--bg)}
button.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
a.open:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;min-height:64px;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font:14px/1.5 var(--font);resize:vertical}
textarea::placeholder{color:var(--faint)}
.error{color:var(--del-fg);font-size:13px;font-weight:700;margin-right:auto}
.error:empty{display:none}
.offline{color:var(--del-fg);background:var(--del-bg);border-radius:8px;padding:8px 12px;margin:0;font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">senpai inbox</p>
    <h1>Waiting for you</h1>
    <p class="sub">Reviews and questions from your coding agents. They wait here until you decide.</p>
  </header>
  <p class="offline" id="offline" hidden>The senpai service is not running. Items will return when an agent asks again.</p>
  <div id="items"></div>
  <p class="empty" id="empty">Nothing is waiting for you.</p>
</main>
<script>
"use strict";
const BOOT = __INBOX_BOOT__;
const list = document.getElementById("items");
const empty = document.getElementById("empty");
const offline = document.getElementById("offline");
const shown = new Map();

function age(seconds) {
  if (seconds < 60) return "just now";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return minutes + " min ago";
  const hours = Math.floor(minutes / 60);
  return hours + " h " + (minutes % 60) + " min ago";
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function kindLabel(kind) {
  return {diff: "Diff review", document: "Document review", question: "Question"}[kind] || kind;
}

function questionForm(item, card) {
  let chosen = null;
  const error = el("span", "error");
  if (item.options.length) {
    const choices = el("div", "choices");
    for (const option of item.options) {
      const button = el("button", "choice", option);
      button.type = "button";
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        chosen = chosen === option ? null : option;
        for (const other of choices.children) other.setAttribute("aria-pressed", String(other === button && chosen !== null));
      });
      choices.append(button);
    }
    card.append(choices);
  }
  const text = el("textarea");
  text.placeholder = item.options.length ? "Add a note (optional)" : "Your answer";
  text.setAttribute("aria-label", "Answer");
  const send = el("button", "primary", "Send answer");
  send.type = "button";
  const dismiss = el("button", "quiet", "Dismiss");
  dismiss.type = "button";
  async function post(body) {
    error.textContent = "";
    send.disabled = dismiss.disabled = true;
    try {
      const response = await fetch(BOOT.answerUrl, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
      if (!response.ok) {
        const detail = await response.json().catch(() => ({}));
        throw new Error(detail.error || "the answer was not accepted");
      }
      card.remove();
      shown.delete(item.id);
      refreshEmpty();
    } catch (failure) {
      error.textContent = failure.message;
      send.disabled = dismiss.disabled = false;
    }
  }
  send.addEventListener("click", () => post({id: item.id, option: chosen, text: text.value}));
  dismiss.addEventListener("click", () => post({id: item.id, dismissed: true}));
  const actions = el("div", "foot");
  actions.append(error, dismiss, send);
  card.append(text, actions);
}

function card(item) {
  const node = el("section", "item" + (item.kind === "question" ? " question" : ""));
  node.id = "item-" + item.id;
  const meta = el("div", "meta");
  const ageNode = el("span", "", age(item.age));
  meta.append(el("span", "kind", kindLabel(item.kind)), ageNode);
  node.append(meta, el("p", "title", item.title || "(no description)"));
  if (item.places.length) node.append(el("p", "places", item.places.join("\n")));
  if (item.kind === "question") {
    questionForm(item, node);
  } else {
    const open = el("a", "open", "Open review");
    open.href = item.url;
    open.target = "_blank";
    open.rel = "noopener";
    const foot = el("div", "foot");
    foot.append(open);
    node.append(foot);
  }
  return {node, ageNode};
}

function refreshEmpty() {
  empty.hidden = shown.size > 0;
  document.title = shown.size ? "(" + shown.size + ") senpai inbox" : "senpai inbox";
}

async function poll() {
  try {
    const response = await fetch(BOOT.itemsUrl, {cache: "no-store"});
    if (!response.ok) throw new Error(String(response.status));
    const {items} = await response.json();
    offline.hidden = true;
    const live = new Set(items.map(item => item.id));
    for (const [id, entry] of shown) {
      if (!live.has(id)) { entry.node.remove(); shown.delete(id); }
    }
    for (const item of items) {
      const entry = shown.get(item.id);
      if (entry) { entry.ageNode.textContent = age(item.age); continue; }
      const created = card(item);
      shown.set(item.id, created);
      list.append(created.node);
    }
  } catch (failure) {
    offline.hidden = false;
  }
  refreshEmpty();
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
