[package]
name = "senpai"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Human-in-the-loop review for coding agents"
publish = false

[dependencies]
crossterm = "0.28"
fancy-regex = "0.19"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
sha1 = "0.10"
sha2 = "0.10"
tiny_http = "0.12"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
libtest-mimic = "0.8"
serde_json = "1"

[[test]]
name = "black_box"
path = "tests/black_box/main.rs"
harness = false
